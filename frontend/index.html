<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliQ. | AI Requirements & JIRA Test Engineering</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M6 5H21V22H6V5ZM10 9H17V18H10V9Z' fill='%23FFFFFF'/%3E%3Cpolygon points='15,16 22,23 18,23 13,18' fill='%23FFFFFF'/%3E%3Crect x='23' y='19' width='4.5' height='4.5' fill='%2386BC25'/%3E%3C/svg%3E" />

      rel="stylesheet"
    />
    <script>
      // Initialize theme instantly before render to prevent flash (default is bright/light)
      (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#EFEFF2] dark:bg-[#09090b] text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col antialiased transition-colors duration-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
