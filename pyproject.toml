[project]
name = "intelliq"
version = "0.1.0"
description = "Serverless AI Requirements & JIRA Test Case Platform ($0 Idle Cost)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.45.0",
    "uvicorn[standard]>=0.34.0",
    "httpx[http2]>=0.28.0",
    "pydantic>=2.10.0",
    "boto3>=1.36.0",
    "pyjwt[crypto]>=2.10.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "lambdas"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "datamodel-code-generator[http]>=0.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "core", "lambdas/stream_worker", "lambdas/api_handler"]

